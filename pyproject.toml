[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptolake"
version = "0.1.0"
description = "Unified crypto market data platform — ingest, normalise, and serve data from multiple exchanges"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CryptoLake" }]

dependencies = [
    "polars>=1.0",
    "pyarrow>=17.0",
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "numpy>=1.24",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.0",
]

[project.scripts]
cryptolake = "cryptolake.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptolake"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends/Query pattern)
    "B904",   # Within except clause raise ... from err
    "TC",     # Type-checking import block rules (clashes with FastAPI runtime type inspection)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
